apiVersion: apps/v1
kind: Deployment
metadata:
  name: ergon
  labels:
    app: ergon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ergon
  template:
    metadata:
      labels:
        app: ergon
    spec:
      containers:
      - name: ergon
        image: ergon:latest
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: sessions
          mountPath: /root/.config/ergon/sessions
        - name: uploads
          mountPath: /app/uploads
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
      volumes:
      - name: sessions
        persistentVolumeClaim:
          claimName: ergon-sessions-pvc
      - name: uploads
        persistentVolumeClaim:
          claimName: ergon-uploads-pvc