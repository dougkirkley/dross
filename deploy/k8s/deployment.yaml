apiVersion: apps/v1
kind: Deployment
metadata:
  name: dross
  labels:
    app: dross
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dross
  template:
    metadata:
      labels:
        app: dross
    spec:
      containers:
      - name: dross
        image: dross:latest
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: sessions
          mountPath: /root/.config/dross/sessions
        - name: uploads
          mountPath: /app/uploads
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
      volumes:
      - name: sessions
        persistentVolumeClaim:
          claimName: dross-sessions-pvc
      - name: uploads
        persistentVolumeClaim:
          claimName: dross-uploads-pvc